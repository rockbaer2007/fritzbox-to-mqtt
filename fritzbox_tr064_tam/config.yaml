name: FritzBox TR-064 TAM MQTT
version: "0.1.0"
slug: fritzbox_tr064_tam
description: Publish FRITZ!Box answering machine and WAN data to Home Assistant via MQTT Discovery
url: https://github.com/local/fritzbox-tr064-ha-addon
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
init: false
services:
  - mqtt:need
options:
  ip: 192.168.178.1
  port: 49000
  user: ""
  password: ""
  call_lists: all,incoming,outgoing,missed
  phonebooks: all
  max_calls: 20
schema:
  ip: str
  port: port
  user: str
  password: password
  call_lists: str
  phonebooks: str
  max_calls: int(1,100)
